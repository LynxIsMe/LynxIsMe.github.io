<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{% feed_meta %}
</head>
<body id="top">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">Lynx :)</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Welcome Home!</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' or page.layout == 'post' and page.section != 'notes' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes/' or page.section == 'notes' %} aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} aria-current="page"{% endif %}>Tags</a>
    </nav>
  </div>
</header>
<main id="main" class="shell">{{ content }}</main>
<footer class="site-footer">
  <div class="shell">
    <h2>Lynx :)</h2>
    <div class="footer-columns">
      <div><span>Lynx :)</span><br><a href="mailto:{{ site.email }}">{{ site.email }}</a></div>
      <div><a class="github-link" href="https://github.com/{{ site.github_username }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.34-3.8-1.34-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 .1.68 2.02 3.3 1.02.1-.73.39-1.23.71-1.52-2.5-.29-5.13-1.25-5.13-5.55 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.97 0 0 .95-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.54.23 2.69.11 2.97.72.79 1.16 1.79 1.16 3.02 0 4.31-2.64 5.26-5.15 5.54.4.35.76 1.04.76 2.1v3.02c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"/></svg>{{ site.github_username }}</a></div>
      <div>Physics @ UCSB</div>
    </div>
  </div>
</footer>
<a class="back-top" href="#top" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 10l6-6 6 6M12 4v16"/></svg></a>
</body>
</html>
